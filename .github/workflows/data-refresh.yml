name: Data refresh

# Rebuilds the store list and coordinates, and refreshes the price cache.
# Two jobs run from the same code:
#   - pages: emits a static JSON snapshot and deploys the UI to GitHub Pages,
#     for the "no server" mode.
#   - warm-cache: calls the hosted API so its SQLite cache is populated before
#     shoppers arrive (only runs when API_BASE is configured).

on:
  schedule:
    - cron: "30 3 * * *" # 06:30 Asia/Jerusalem
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Ingest stores and geocode
        run: |
          go run ./cmd/ingest --db data/prices.db --snapshot web/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  warm-cache:
    if: ${{ vars.API_BASE != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -fsS "${{ vars.API_BASE }}/api/health"
